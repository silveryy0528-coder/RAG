# A CI pipeline to test the code on:
# 1. Windows with Python 3.10, 3.11, and 3.12
# 2. Each commit to a pull request to the main branch
# 3. Each push to the repository

name: Unit tests

on:
  pull_request:
    branches:
      - main
  push:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        os: [windows-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install src
      run: python -m pip install -e .

    - name: Install packages for formatting and testing
      run: python -m pip install pytest pylint black

    - name: Test with pytest
      run: pytest tests

    - name: Format with black
      run: black rag scripts

    - name: Check with pylint
      run: pylint rag