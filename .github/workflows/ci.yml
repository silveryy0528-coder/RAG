# A CI pipeline to test the code on:
# 1. Windows with Python 3.10, 3.11, and 3.12
# 2. Each commit to a pull request to the main branch
# 3. Each push to the repository

name: Unit tests

on:
  pull_request:
    branches:
      - main
  push:

jobs:
  build:
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        os: [windows-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install src
      run: python -m pip install -e .

    - name: Cache Hugging Face model downloads
      uses: actions/cache@v4
      with:
        path: ${{ env.HOME }}/.cache/huggingface/hub
        key: ${{ runner.os }}-hf-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-hf-

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ${{ runner.os }}-pip-cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies for testing and formatting
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt

    - name: Test with pytest
      run: pytest tests

    - name: Format with black
      run: black rag
